[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="blender/*, shot*.png"
export_path="web/index.html"

[preset.0.options]

variant/thread_support=false
html/canvas_resize_policy=2
html/head_include="<style>body{background:#1b120c!important}#status-splash{display:none!important}body::before{content:'வள்ளுவர் குளம்';position:fixed;z-index:5;left:0;right:0;top:36%;text-align:center;font:700 44px serif;color:#f2bc5c}body::after{content:'குளம் நிரம்புகிறது… முதல் முறை சற்று நேரம் ஆகும்.';position:fixed;z-index:5;left:0;right:0;top:calc(36% + 70px);text-align:center;font:16px sans-serif;color:#cdbfa8}canvas{position:relative;z-index:6}</style>"
html/focus_canvas_on_start=true
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/background_color=Color(0.106, 0.071, 0.047, 1)
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
