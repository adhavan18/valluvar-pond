[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="blender/*, docs/*, web/*, shot*.png"
export_path="web/index.html"

[preset.0.options]

variant/thread_support=false
html/canvas_resize_policy=2
html/head_include="<link rel='preload' href='index.wasm' as='fetch' type='application/wasm' crossorigin><link rel='preload' href='index.pck' as='fetch' crossorigin><style>body{background:#1b120c!important}#status-splash{display:none!important}body::before{content:'வள்ளுவர் குளம்';position:fixed;z-index:5;left:0;right:0;top:36%;text-align:center;font:700 44px serif;color:#f2bc5c}body::after{content:'குளம் நிரம்புகிறது… முதல் முறை சற்று நேரம் ஆகும்.';position:fixed;z-index:5;left:0;right:0;top:calc(36% + 70px);text-align:center;font:16px sans-serif;color:#cdbfa8}canvas{position:relative;z-index:6}#turn{display:none;position:fixed;inset:0;z-index:20;background:#1b120c;color:#f2bc5c;font:700 22px sans-serif;text-align:center;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:24px}#turn i{font-size:64px;font-style:normal;animation:turn 1.6s ease-in-out infinite}@keyframes turn{0%,20%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}@media (orientation:portrait) and (pointer:coarse){#turn{display:flex}}</style><script>addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='turn';d.innerHTML='<i>\\u25AF</i>\\u0BA4\\u0BCA\\u0BB2\\u0BC8\\u0BAA\\u0BC7\\u0B9A\\u0BBF\\u0BAF\\u0BC8\\u0BAA\\u0BCD \\u0BAA\\u0B95\\u0BCD\\u0B95\\u0BB5\\u0BBE\\u0B9F\\u0BCD\\u0B9F\\u0BBF\\u0BB2\\u0BCD \\u0BA4\\u0BBF\\u0BB0\\u0BC1\\u0BAA\\u0BCD\\u0BAA\\u0BC1\\u0B99\\u0BCD\\u0B95\\u0BB3\\u0BCD';document.body.appendChild(d);function go(){if(!matchMedia('(pointer:coarse)').matches)return;var e=document.documentElement;try{var r=e.requestFullscreen&&e.requestFullscreen();var l=function(){try{screen.orientation.lock('landscape').catch(function(){})}catch(x){}};if(r&&r.then)r.then(l).catch(function(){});else l()}catch(x){}}addEventListener('pointerup',go,{once:true})});</script>"
html/focus_canvas_on_start=true
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/background_color=Color(0.106, 0.071, 0.047, 1)
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
